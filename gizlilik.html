<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gizlilik · Akts Studio</title>
<meta name="description" content="Akts Studio sitelerinin (akts.tr ve alt alan adları) gizlilik metni. Analitik yok, izleme yok, üyelik yok." />
<link rel="canonical" href="https://akts.tr/gizlilik" />
<meta property="og:type" content="article" />
<meta property="og:url" content="https://akts.tr/gizlilik" />
<meta property="og:site_name" content="Akts Studio" />
<meta property="og:title" content="Gizlilik · Akts Studio" />
<meta property="og:description" content="Analitik yok, izleme yok, üyelik yok. Ne toplandığı ve ne toplanmadığı tek tek yazılı." />
<meta property="og:locale" content="tr_TR" />
<meta name="theme-color" content="#0a0a0a" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<script>
/* index.html ile AYNI betik. Tema React'ten önce yazılmazsa sayfa bir
   kare koyu açılıp açık temaya atlıyor (FOUC). */
(function () {
  try {
    var t = localStorage.getItem('akts-theme');
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fbfbfd');
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/gizlilik.tsx"></script>
</body>
</html>
