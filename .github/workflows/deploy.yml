name: Deploy akts.tr

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-akts
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: echo "$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" > dist/SURUM

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload build
        run: rsync -az --delete -e "ssh -i ~/.ssh/deploy" dist/ deploy@${{ secrets.DEPLOY_HOST }}:/srv/paketsoft-deploy/akts/

      - name: Activate release
        run: ssh -i ~/.ssh/deploy deploy@${{ secrets.DEPLOY_HOST }} akts
