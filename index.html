<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<meta name="description" content="Akts Studio — Android uygulamaları, web siteleri ve servisler. Aktaş Mail, OyunHub, StudyTrack, Ezan Vaktim, BlankReel, n8n ve portfolyo." />

<meta property="og:site_name" content="Akts Studio" />
<meta property="og:title" content="Akts Studio" />
<meta property="og:description" content="Aktaş Mail, OyunHub, StudyTrack, MehtApp, Aktaş Fit, BlankReel ve portfolyo — hepsi Akts Studio çatısı altında." />

<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Akts Studio" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://akts.tr/og.png?v=3" />
<!-- Discord bağlantı önizlemesinin yan şeridi bu rengi kullanır; sayfa teması aşağıda yeniden yazar. -->
<meta name="theme-color" content="#bb2a2a" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<script>
/* Tema, React yüklenmeden ÖNCE yazılıyor. Yoksa sayfa bir kare koyu
   açılıp açık temaya atlıyor (FOUC). ThemeToggle sonra aynı değeri
   okuyup devralıyor. */
(function () {
  try {
    var t = localStorage.getItem('akts-theme');
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fbfbfd');
  } catch (e) {}
})();
</script>
<style>
#boot{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#0a0a0a;transition:opacity .35s ease,visibility .35s}
:root[data-theme="light"] #boot{background:#fbfbfd}
#boot.done{opacity:0;visibility:hidden;pointer-events:none}
#boot .lg{width:64px;height:64px;border-radius:16px;animation:bootpop 1.1s ease-in-out infinite alternate}
#boot .ring{position:absolute;width:104px;height:104px;border-radius:50%;border:2px solid rgba(128,128,128,.18);border-top-color:#ff5b4a;animation:bootspin .9s linear infinite}
@keyframes bootpop{from{transform:scale(.94);opacity:.8}to{transform:scale(1);opacity:1}}
@keyframes bootspin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#boot .lg,#boot .ring{animation:none}#boot{transition-duration:.01s}}
</style>
<noscript><style>#boot{display:none}</style></noscript>
</head>
<body>
<div id="boot" aria-hidden="true"><span class="ring"></span><img class="lg" src="/brand/akts-studio.svg" alt="" width="64" height="64"></div>
    <div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script>
/* Yükleme ekranı: fontlar + sayfa hazır olunca (en az .4 sn, en fazla 1.5 sn) kapanır. */
(function () { var b = document.getElementById('boot'), t0 = performance.now(), closed = false;
  function close() { if (closed) return; closed = true; setTimeout(function () { b.classList.add('done'); setTimeout(function () { b.remove(); }, 500); }, Math.max(0, 400 - (performance.now() - t0))); }
  Promise.all([document.fonts ? document.fonts.ready : 0, new Promise(function (r) { document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true }); })]).then(close);
  setTimeout(close, 1500); })();
</script>
</body>
</html>
