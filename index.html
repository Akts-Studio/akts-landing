<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Akts Studio</title>
<meta name="description" content="Akts Studio — Android uygulamaları, web siteleri ve servisler. Aktaş Mail, OyunHub, StudyTrack, Ezan Vaktim, BlankReel, n8n ve portfolyo." />
<link rel="canonical" href="https://akts.tr/" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://akts.tr/" />
<meta property="og:site_name" content="Akts Studio" />
<meta property="og:title" content="Akts Studio" />
<meta property="og:description" content="Aktaş Mail, OyunHub, StudyTrack, Ezan Vaktim, BlankReel ve portfolyo — hepsi Akts Studio çatısı altında." />
<meta property="og:locale" content="tr_TR" />
<meta property="og:image" content="https://akts.tr/og.png?v=3" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Akts Studio" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://akts.tr/og.png?v=3" />
<!-- Discord bağlantı önizlemesinin yan şeridi bu rengi kullanır; sayfa teması aşağıda yeniden yazar. -->
<meta name="theme-color" content="#bb2a2a" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon.svg" />
<script>
/* Tema, React yüklenmeden ÖNCE yazılıyor. Yoksa sayfa bir kare koyu
   açılıp açık temaya atlıyor (FOUC). ThemeToggle sonra aynı değeri
   okuyup devralıyor. */
(function () {
  try {
    var t = localStorage.getItem('akts-theme');
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', t === 'dark' ? '#0a0a0a' : '#fbfbfd');
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
